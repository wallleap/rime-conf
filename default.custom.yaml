patch:
  'schema_list/@before 0':
    schema: double_pinyin_flypy                   # 设置当前方案为小鹤双拼
  schema_list/+:
    # 添加拆字方案
    - schema: radical                             # 双拼拆字方案
    - schema: radical_pinyin                      # 部件拆字 + 全拼双拼
  menu/page_size: 4 # 候选项数
  # 用户习惯学习配置
  "translator/enable_user_dict": true
  "translator/enable_sentence": true
  "translator/max_phrase_length": 10
  "translator/initial_quality": 10
  "ascii_composer/good_old_caps_lock": false
  "ascii_composer/switch_key":
    Caps_Lock: noop
    Control_L: noop
    Control_R: noop
    Eisu_toggle: clear
    Shift_L: commit_code
    Shift_R: commit_code
  # 按键绑定
  "key_binder/bindings":
    # 上翻页
    - {accept: "Control+k", send: Page_Up, when: composing}
    - {accept: "Shift+Tab", send: Page_Up, when: composing}
    - {accept: minus, send: Page_Up, when: composing}
    - {accept: bracketleft, send: Page_Up, when: composing}
    # 下翻页
    - {accept: "Control+j", send: Page_Down, when: composing}
    - {accept: Tab, send: Page_Down, when: composing}
    - {accept: equal, send: Page_Down, when: composing}
    - {accept: bracketright, send: Page_Down, when: composing}
    # 选词
    - {accept: semicolon, send: 2, when: has_menu}
    - {accept: apostrophe, send: 3, when: has_menu}
    - {accept: comma, send: 4, when: has_menu}
    # 切换全角/半角
    - {accept: "Shift+space", toggle: full_shape, when: always}
